<body>
    <script>
        function addOne(array){
            const num=[]
            for(i=0;i<array.length;i++){
            num.push(array[i]+1);

        }
            return num;
    }
    console.log(addOne([1,2,3]));
    console.log(addOne([-2,-1,0,99]));
    </script>
</body>
